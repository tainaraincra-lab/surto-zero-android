name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
        with: {packages: "platforms;android-33 build-tools;33.0.2 platform-tools"}
      - run: |
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_HOME" "$ANDROID_HOME" "$GITHUB_WORKSPACE" > "$HOME/.config/godot/editor_settings-4.3.tres"
          unzip -q SurtoZero-Godot-CloudBuild.zip -d project
          echo "PROJECT_DIR=$(find project -name project.godot -exec dirname {} \; | head -1)" >> "$GITHUB_ENV"
      - run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot && chmod +x godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          mkdir -p build
          ./godot --headless --path "$PROJECT_DIR" --export-debug "Android Debug" build/SurtoZero-debug.apk
      - uses: actions/upload-artifact@v4
        with: {name: SurtoZero-APK, path: build/SurtoZero-debug.apk, if-no-files-found: error}
